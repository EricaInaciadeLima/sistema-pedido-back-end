# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Datasource (H2 in memory)
spring.datasource.url=jdbc:h2:mem:meubanco;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Let Flyway control the schema
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# S3 / LocalStack
app.s3.endpoint=http://localhost:4566
app.s3.bucket=produtos

# Application context
server.servlet.context-path=/spa

# Port
server.port=8080

# Optional (removes warning)
spring.jpa.open-in-view=false
