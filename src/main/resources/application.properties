# ===============================
# H2 Console
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
# ===============================
# Datasource (H2 em memória)
# ===============================
spring.datasource.url=jdbc:h2:mem:meubanco;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# IMPORTANTE: deixe o Flyway controlar o schema
spring.jpa.hibernate.ddl-auto=none
# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# ===============================
# Contexto da aplicação
# ===============================
server.servlet.context-path=/spa
# ===============================
# Porta (mude se der conflito)
# ===============================
server.port=8080
# ===============================
# Opcional (remove warning)
# ===============================
spring.jpa.open-in-view=false