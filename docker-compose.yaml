version: '3.8'

services:
  localstack:
    image: localstack/localstack:3.5.0
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "./docker/localstack/init:/etc/localstack/init/ready.d"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sistema-pedido
    ports:
      - "8080:8080"
    environment:
      APP_S3_ENDPOINT: http://localstack:4566
      APP_S3_BUCKET: produtos
    depends_on:
      - localstack
